name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    name: Build, attest and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false

      - name: Build release packages
        shell: bash
        run: bash scripts/release/build-release.sh "${GITHUB_REF_NAME}" "${GITHUB_WORKSPACE}/dist"

      - name: Verify release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS

      - name: Attest release packages
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Attest checksum manifest
        uses: actions/attest@v4
        with:
          subject-path: dist/SHA256SUMS

      - name: Verify generated attestations against repository identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while read -r _ artifact; do
            artifact="${artifact#\*}"
            gh attestation verify "dist/${artifact}" --repo "${GITHUB_REPOSITORY}"
          done < dist/SHA256SUMS
          gh attestation verify dist/SHA256SUMS --repo "${GITHUB_REPOSITORY}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --generate-notes \
            --title "HooshiXAgent ${GITHUB_REF_NAME}"
