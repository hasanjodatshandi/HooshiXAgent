name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Dry-run package version; no GitHub release is published
        required: true
        default: v0.0.0-r6-verify
        type: string

permissions:
  contents: read

jobs:
  policy:
    name: Verify exact release commit
    runs-on: ubuntu-latest
    # Bounded so a hung step cannot hold a hosted runner and stall a release.
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      release_sha: ${{ steps.release_commit.outputs.release_sha }}
      release_version: ${{ steps.release_commit.outputs.release_version }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Resolve release commit and version
        id: release_commit
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "release verification dry-run must be dispatched from main" >&2
              exit 1
            fi
            release_sha="${GITHUB_SHA}"
            release_version="${REQUESTED_VERSION}"
          else
            release_sha="$(git rev-list -n1 "${GITHUB_REF_NAME}")"
            release_version="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release source did not resolve to a Git commit" >&2
            exit 1
          fi
          if [[ ! "$release_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "release version is not a valid v-prefixed semantic version" >&2
            exit 1
          fi
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"

      - name: Require successful CI and final release gate for exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release/verify-release-commit.py \
            --sha '${{ steps.release_commit.outputs.release_sha }}' \
            --repo '${{ github.repository }}'

  build:
    name: Build release archives and Gateway image candidate
    needs: policy
    runs-on: ubuntu-latest
    # Bounded so a hung step cannot hold a hosted runner and stall a release.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ needs.policy.outputs.release_sha }}

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Build release packages
        shell: bash
        run: bash scripts/release/build-release.sh '${{ needs.policy.outputs.release_version }}' "${GITHUB_WORKSPACE}/dist"

      - name: Build final Gateway image candidate
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull=false -t 'hooshix-gateway:${{ needs.policy.outputs.release_version }}' -f deploy/gateway/Dockerfile .
          docker save 'hooshix-gateway:${{ needs.policy.outputs.release_version }}' -o "${RUNNER_TEMP}/hooshix-gateway-image.tar"

      - name: Verify release archive checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS

      - name: Upload verified release archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-${{ needs.policy.outputs.release_sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Gateway image candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-gateway-image-${{ needs.policy.outputs.release_sha }}
          path: ${{ runner.temp }}/hooshix-gateway-image.tar
          if-no-files-found: error
          retention-days: 7

  windows-setup:
    name: Build the supported Windows installer (Setup.exe)
    needs:
      - policy
      - build
    # The supported Windows distribution is HooshiXAgent-Setup.exe. It is a
    # .NET-free Go build that embeds the Agent and tray binaries and the UAC
    # manifest, and its payload embed step needs Windows resource tooling, so it
    # is built here rather than on the Ubuntu build job. It is a required
    # prerequisite of finalize/attest/publish: a release whose Windows installer
    # cannot be built must not be published (ADR-0014 rollout step R5).
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ needs.policy.outputs.release_sha }}

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Install rsrc resource compiler
        shell: pwsh
        run: go install github.com/akavel/rsrc@v0.10.2

      # Downloaded outside the workspace on purpose. Go stamps a binary with
      # `vcs.modified=true` whenever `git status --porcelain` is non-empty, so an
      # artifact unpacked into the checkout would change the bytes of the Agent
      # payload and break the payload tie-in asserted in the next step. Keeping
      # the tree pristine is what makes the Windows and Ubuntu builds of the same
      # commit byte-identical.
      - name: Download verified release archives
        uses: actions/download-artifact@6b208ae046db98e579e8a3aa621ab581ff575935 # v4.1.1
        with:
          name: release-candidate-${{ needs.policy.outputs.release_sha }}
          path: ${{ runner.temp }}/candidate

      - name: Extract and verify the released Windows Agent package
        shell: pwsh
        run: |
          $version = '${{ needs.policy.outputs.release_version }}'
          $zip = Join-Path $env:RUNNER_TEMP "candidate\hooshix-agent_${version}_windows_amd64.zip"
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw "the released Windows package is missing: $zip" }
          $released = Join-Path $env:RUNNER_TEMP 'released-agent'
          New-Item -ItemType Directory -Force -Path $released | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $released -Force
          $manifest = Join-Path $released 'SHA256SUMS'
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) { throw "the released Windows package carries no SHA256SUMS: $zip" }
          $binary = Join-Path $released 'hooshix-agent.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw "the released Windows package carries no hooshix-agent.exe: $zip" }
          $entry = Get-Content -LiteralPath $manifest | Where-Object { $_ -match '(?i)hooshix-agent\.exe$' } | Select-Object -First 1
          if (-not $entry) { throw "the released Windows package manifest has no hooshix-agent.exe entry: $manifest" }
          $expected = ($entry.Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $binary).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "the released Windows package does not match its own SHA256SUMS ($expected vs $actual)" }
          Write-Host "released Windows Agent binary verified: hooshix-agent.exe = $actual"

      # HOOSHIX_RELEASE_SHA256SUMS makes the payload match the released binary or
      # fail the build: it is the tie between the installer that ships and the
      # attested archive. HOOSHIX_VERSION supplies the same agent.Version linker
      # value build-release.sh used, without which the payload bytes could never
      # match. Both are required, not optional.
      - name: Build HooshiXAgent-Setup.exe tied to the released Agent binary
        shell: pwsh
        run: |
          $env:HOOSHIX_VERSION = '${{ needs.policy.outputs.release_version }}'
          $env:HOOSHIX_RELEASE_SHA256SUMS = Join-Path $env:RUNNER_TEMP 'released-agent\SHA256SUMS'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-setup.ps1
          if ($LASTEXITCODE -ne 0) { throw "scripts/build-setup.ps1 failed with exit code $LASTEXITCODE" }

      - name: Verify the distribution artifacts exist
        shell: pwsh
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          foreach ($name in @('HooshiXAgent-Setup.exe', 'hooshix-agent.exe', 'hooshix-agent-tray.exe')) {
            $path = Join-Path $dist $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "missing distribution artifact: $name" }
            $info = Get-Item -LiteralPath $path
            if ($info.Length -lt 1MB) { throw "distribution artifact suspiciously small: $name ($($info.Length) bytes)" }
            Write-Host "$name = $($info.Length) bytes"
          }

      - name: Upload the supported Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-setup-${{ needs.policy.outputs.release_sha }}
          path: dist/HooshiXAgent-Setup.exe
          if-no-files-found: error
          retention-days: 7

  finalize:
    name: Finalize candidate (SBOM, vulnerability scan, checksums)
    needs:
      - policy
      - build
      - windows-setup
    runs-on: ubuntu-latest
    # Bounded so a hung step cannot hold a hosted runner and stall a release.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.policy.outputs.release_sha }}

      - name: Download verified release archives
        uses: actions/download-artifact@6b208ae046db98e579e8a3aa621ab581ff575935 # v4.1.1
        with:
          name: release-candidate-${{ needs.policy.outputs.release_sha }}
          path: dist

      - name: Download the supported Windows installer
        uses: actions/download-artifact@6b208ae046db98e579e8a3aa621ab581ff575935 # v4.1.1
        with:
          name: release-setup-${{ needs.policy.outputs.release_sha }}
          path: dist

      - name: Download Gateway image candidate
        uses: actions/download-artifact@6b208ae046db98e579e8a3aa621ab581ff575935 # v4.1.1
        with:
          name: release-gateway-image-${{ needs.policy.outputs.release_sha }}
          path: ${{ runner.temp }}/gateway-image

      - name: Verify the installer embeds the published Agent binary verbatim
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.policy.outputs.release_version }}'
          if [[ ! -f dist/HooshiXAgent-Setup.exe ]]; then
            echo "the supported Windows installer is missing from the release candidate" >&2
            exit 1
          fi
          rm -rf "${RUNNER_TEMP}/released-agent"
          mkdir -p "${RUNNER_TEMP}/released-agent"
          unzip -o -q "dist/hooshix-agent_${version}_windows_amd64.zip" -d "${RUNNER_TEMP}/released-agent"
          python3 - "${RUNNER_TEMP}/released-agent/hooshix-agent.exe" dist/HooshiXAgent-Setup.exe <<'PY'
          import sys
          payload = open(sys.argv[1], 'rb').read()
          setup = open(sys.argv[2], 'rb').read()
          if len(payload) < 1 << 20:
              raise SystemExit(f'released Agent binary is implausibly small: {len(payload)} bytes')
          if payload not in setup:
              raise SystemExit('HooshiXAgent-Setup.exe does not embed the released hooshix-agent.exe verbatim')
          print(f'HooshiXAgent-Setup.exe embeds the released Agent binary verbatim ({len(payload)} bytes)')
          PY

      # The SBOM/scan step is the single place every published artifact is
      # covered, and it regenerates SHA256SUMS over the complete set — including
      # HooshiXAgent-Setup.exe and the SBOMs it just produced, so the installer is
      # checksummed and attested exactly like the archives.
      - name: Generate SBOMs and scan the complete release candidate
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/release/supply-chain-artifacts.sh \
            "${GITHUB_WORKSPACE}/dist" \
            "${RUNNER_TEMP}/gateway-image/hooshix-gateway-image.tar" \
            '${{ needs.policy.outputs.release_version }}'

      - name: Verify finalized release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS
          grep -q 'HooshiXAgent-Setup.exe$' SHA256SUMS

      - name: Upload finalized release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-final-${{ needs.policy.outputs.release_sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest and verify release candidate
    needs:
      - policy
      - build
      - windows-setup
      - finalize
    runs-on: ubuntu-latest
    # Bounded so a hung step cannot hold a hosted runner and stall a release.
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download finalized release candidate
        uses: actions/download-artifact@6b208ae046db98e579e8a3aa621ab581ff575935 # v4.1.1
        with:
          name: release-final-${{ needs.policy.outputs.release_sha }}
          path: dist

      - name: Verify release checksums before privileged operations
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS

      - name: Attest release packages and SBOMs
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Attest checksum manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/SHA256SUMS

      - name: Verify generated attestations against repository identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while read -r _ artifact; do
            artifact="${artifact#\*}"
            gh attestation verify "dist/${artifact}" --repo "${GITHUB_REPOSITORY}"
          done < dist/SHA256SUMS
          gh attestation verify dist/SHA256SUMS --repo "${GITHUB_REPOSITORY}"

  publish:
    name: Publish verified release
    if: github.event_name == 'push'
    needs:
      - policy
      - build
      - windows-setup
      - finalize
      - attest
    runs-on: ubuntu-latest
    # Bounded so a hung step cannot hold a hosted runner and stall a release.
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Download attested release candidate
        uses: actions/download-artifact@6b208ae046db98e579e8a3aa621ab581ff575935 # v4.1.1
        with:
          name: release-final-${{ needs.policy.outputs.release_sha }}
          path: dist

      - name: Verify release checksums and attestations before publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS
          while read -r _ artifact; do
            artifact="${artifact#\*}"
            gh attestation verify "${artifact}" --repo "${GITHUB_REPOSITORY}"
          done < SHA256SUMS
          gh attestation verify SHA256SUMS --repo "${GITHUB_REPOSITORY}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --generate-notes \
            --title "HooshiXAgent ${GITHUB_REF_NAME}"
