name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only pull-request runs may be cancelled by a newer push. A push to main must
  # never cancel its own run: scripts/release/verify-release-commit.py requires a
  # COMPLETED, SUCCESSFUL push run for the exact release SHA, and cancelling it
  # would silently make that commit unreleasable.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-quality:
    name: Go quality / tests / vulnerability
    runs-on: ubuntu-latest
    # Bounded so a hung step cannot hold a hosted runner (and the
    # release gate chained behind it) indefinitely.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Install pinned Go quality tools
        shell: bash
        run: |
          set -euo pipefail
          go install golang.org/x/tools/cmd/goimports@v0.48.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run Go quality baseline
        shell: bash
        run: bash scripts/ci/go-quality.sh

  agent-platform:
    name: Agent platform foundations (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Bounded so a hung step cannot hold a hosted runner (and the
    # release gate chained behind it) indefinitely.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Test Agent platform foundations
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./internal/agent
          go build ./cmd/agent

      - name: Fuzz Agent local-target policy
        shell: bash
        run: go test -run '^$' -fuzz '^FuzzValidateLocalTarget$' -fuzztime=1s ./internal/agent

      # The Windows-only product surface (internal/tray is entirely
      # //go:build windows, internal/agent/svc installs the service, and
      # cmd/hooshix-setup is the desktop installer) is invisible to the Linux
      # and macOS legs, and the narrow selectors above never reach it. The full
      # module test run on Windows is what executes those tests at all.
      - name: Full module tests (Windows-only product surface)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...

      - name: Clean Agent package install / rollback / uninstall (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/ci/agent-install-smoke.sh

      - name: Clean Agent package install / rollback / uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/agent-install-smoke.ps1

  architecture:
    name: Architecture fitness
    runs-on: ubuntu-latest
    # Bounded so a hung step cannot hold a hosted runner (and the
    # release gate chained behind it) indefinitely.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run architecture fitness tests
        shell: bash
        run: go test -count=1 ./tests/architecture

  security:
    name: Gitleaks / Semgrep
    runs-on: ubuntu-latest
    # Bounded so a hung step cannot hold a hosted runner (and the
    # release gate chained behind it) indefinitely.
    timeout-minutes: 25
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Install Semgrep
        shell: bash
        run: python -m pip install --disable-pip-version-check semgrep==1.174.0

      - name: Install Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" /tmp/gitleaks
          archive="/tmp/gitleaks/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C /tmp/gitleaks gitleaks
          install -m 0755 /tmp/gitleaks/gitleaks "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run secret and static security scans
        shell: bash
        run: bash scripts/ci/security.sh

  resource-dos:
    name: R-3 resource / DoS budget gate
    runs-on: ubuntu-latest
    # Bounded so a hung step cannot hold a hosted runner (and the
    # release gate chained behind it) indefinitely.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run resource and DoS budget gate
        shell: bash
        run: bash scripts/ci/resource-dos.sh

  streaming-ingress:
    name: R-4 streaming ingress gate
    runs-on: ubuntu-latest
    # Bounded so a hung step cannot hold a hosted runner (and the
    # release gate chained behind it) indefinitely.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run streaming ingress gate
        shell: bash
        run: bash scripts/ci/streaming-ingress.sh

  http-proxy-correctness:
    name: R-5 HTTP / stream isolation gate
    runs-on: ubuntu-latest
    # Bounded so a hung step cannot hold a hosted runner (and the
    # release gate chained behind it) indefinitely.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run HTTP and stream-isolation gate
        shell: bash
        run: bash scripts/ci/http-proxy-correctness.sh

  supply-chain:
    name: R-6 release / supply-chain gate
    runs-on: ubuntu-latest
    # Bounded so a hung step cannot hold a hosted runner (and the
    # release gate chained behind it) indefinitely.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run release and supply-chain gate
        shell: bash
        run: bash scripts/ci/supply-chain.sh

  metadata-scalability:
    name: R-7 metadata scalability / determinism gate
    runs-on: ubuntu-latest
    # Bounded so a hung step cannot hold a hosted runner (and the
    # release gate chained behind it) indefinitely.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run metadata scalability and determinism gate
        shell: bash
        run: bash scripts/ci/metadata-scalability.sh

  observability-writer:
    name: R-8 observability / writer isolation gate
    runs-on: ubuntu-latest
    # Bounded so a hung step cannot hold a hosted runner (and the
    # release gate chained behind it) indefinitely.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run observability and writer-isolation gate
        shell: bash
        run: bash scripts/ci/observability-writer.sh

  agent-state-installer:
    name: R-9 Agent state / installer hardening gate
    runs-on: ubuntu-latest
    # Bounded so a hung step cannot hold a hosted runner (and the
    # release gate chained behind it) indefinitely.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run Agent state and installer hardening gate
        shell: bash
        run: bash scripts/ci/agent-state-installer.sh

  agent-state-transaction:
    name: RA-5 Agent state transaction hardening gate
    runs-on: ubuntu-latest
    # Bounded so a hung step cannot hold a hosted runner (and the
    # release gate chained behind it) indefinitely.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run Agent state transaction hardening gate
        shell: bash
        run: bash scripts/ci/agent-state-transaction.sh

  filesystem-installer-hardening:
    name: RA-6 filesystem / installer hardening (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Bounded so a hung step cannot hold a hosted runner (and the
    # release gate chained behind it) indefinitely.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run Unix filesystem / installer hardening gate
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/ci/filesystem-installer-hardening.sh

      - name: Run Windows filesystem / installer hardening gate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go test -count=5 ./internal/agent ./internal/gateway -run '^TestRA6'
          # Windows-only packages that no other leg compiles or runs: the tray,
          # the service installer and the supervisor.
          go test -count=1 ./internal/tray ./internal/agent/svc ./internal/agent/supervisor ./cmd/hooshix-setup
          ./scripts/ci/agent-install-smoke.ps1

  infrastructure-runtime:
    name: R-10 infrastructure runtime hardening gate
    runs-on: ubuntu-latest
    # Bounded so a hung step cannot hold a hosted runner (and the
    # release gate chained behind it) indefinitely.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run infrastructure runtime hardening gate
        shell: bash
        run: bash scripts/ci/infrastructure-runtime.sh

  comprehensive-tests:
    name: R-11 comprehensive test expansion gate
    runs-on: ubuntu-latest
    # Bounded so a hung step cannot hold a hosted runner (and the
    # release gate chained behind it) indefinitely.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run comprehensive test expansion gate
        shell: bash
        env:
          HOOSHIX_R11_COVERAGE_DIR: ${{ runner.temp }}/hooshix-r11-coverage
        run: bash scripts/ci/comprehensive-tests.sh

      - name: Upload R-11 coverage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r11-coverage-${{ github.sha }}
          path: ${{ runner.temp }}/hooshix-r11-coverage
          if-no-files-found: error
          retention-days: 30

  performance-capacity:
    name: R-12 performance / capacity gate
    runs-on: ubuntu-latest
    # Bounded so a hung step cannot hold a hosted runner (and the
    # release gate chained behind it) indefinitely.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run performance and capacity gate
        shell: bash
        env:
          HOOSHIX_R12_EVIDENCE_DIR: ${{ runner.temp }}/hooshix-r12-evidence
        run: bash scripts/ci/performance-capacity.sh

      - name: Upload R-12 performance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r12-performance-${{ github.sha }}
          path: ${{ runner.temp }}/hooshix-r12-evidence
          if-no-files-found: error
          retention-days: 30

  e2e-acceptance:
    name: Agent↔Gateway E2E acceptance
    runs-on: ubuntu-latest
    # Bounded so a hung step cannot hold a hosted runner (and the
    # release gate chained behind it) indefinitely.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run real Agent↔Gateway E2E acceptance
        shell: bash
        run: bash scripts/ci/e2e-acceptance.sh

  live-metadata-lifecycle:
    name: RA-3 live metadata lifecycle gate
    runs-on: ubuntu-latest
    # Bounded so a hung step cannot hold a hosted runner (and the
    # release gate chained behind it) indefinitely.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run live authorization lifecycle gate
        shell: bash
        run: bash scripts/ci/live-metadata-lifecycle.sh

  multi-host-public-edge:
    name: RA-4 multi-host public edge gate
    runs-on: ubuntu-latest
    # Bounded so a hung step cannot hold a hosted runner (and the
    # release gate chained behind it) indefinitely.
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run multi-host public edge gate
        shell: bash
        run: bash scripts/ci/multi-host-public-edge.sh

  packaging-ops:
    name: Packaging / clean deployment / rollback
    runs-on: ubuntu-latest
    # Bounded so a hung step cannot hold a hosted runner (and the
    # release gate chained behind it) indefinitely.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run packaging and operations gate
        shell: bash
        run: bash scripts/ci/packaging-ops.sh

  windows-distribution-build:
    name: Windows desktop distribution build / service install gate (setup + tray)
    runs-on: windows-latest
    # Bounded so a hung step cannot hold a hosted runner (and the
    # release gate chained behind it) indefinitely. Raised from 35 to 60 because
    # this job no longer only builds the distribution: it now also runs the real
    # install/run/restart/uninstall gate below, whose internal waits are bounded
    # at roughly 39 minutes in the pathological case (Setup.exe install 600 s and
    # uninstall 600 s, plus per-assertion waits of 60-120 s). A job timeout that
    # fired mid-gate would report as a timeout instead of naming the failing
    # assertion, which is exactly the opaque failure the gate exists to remove.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Install rsrc resource compiler
        shell: pwsh
        run: go install github.com/akavel/rsrc@v0.10.2

      # Build integrity for the whole module on Windows, before any build step
      # has created resources or payload files. cmd/hooshix-setup keeps its
      # //go:embed payload behind the hooshix_release_payload build tag so this
      # works from a clean checkout, where the gitignored payload binaries do
      # not exist. A repository that cannot build on Windows from a fresh
      # checkout must fail here, not in a user's hands.
      - name: Build and vet the whole module (clean checkout)
        shell: bash
        run: |
          set -euo pipefail
          go build ./...
          go vet ./...

      # Guards against the shipped installer ever diverging from source
      # again: the full setup/tray/agent distribution must build from a
      # clean checkout with no manual resource steps.
      - name: Build HooshiXAgent-Setup.exe distribution
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build-setup.ps1

      - name: Verify distribution artifacts exist
        shell: pwsh
        run: |
          $dist = "${{ github.workspace }}\dist"
          foreach ($name in @('HooshiXAgent-Setup.exe', 'hooshix-agent.exe', 'hooshix-agent-tray.exe')) {
            $path = Join-Path $dist $name
            if (-not (Test-Path $path)) { throw "missing distribution artifact: $name" }
            $info = Get-Item $path
            if ($info.Length -lt 1MB) { throw "distribution artifact suspiciously small: $name ($($info.Length) bytes)" }
            Write-Host "$name = $($info.Length) bytes"
          }

      # The real runtime procedure for cmd/hooshix-setup and cmd/hooshix-agent-tray
      # is scripts/ci/windows-service-install-smoke.ps1 (Executable Runtime Gate
      # gap G1, ADR-0014 rollout step R4). Everything
      # above this step is build integrity: it proves the distribution can be
      # built from a clean checkout and that three files exist. This step
      # executes the capability instead — it installs the distribution that was
      # just built, asserts the accepted ADR-0014 persistence model, exercises
      # SCM restart-on-failure after a forced termination, and asserts that the
      # installed uninstaller removes the service, install tree, ARP entry, tray
      # task and machine-wide state again.
      #
      # -SetupExe reuses the artifact built above rather than rebuilding it.
      #
      # This gate fails closed and never skips: it asserts the elevated
      # precondition up front, and every remaining assertion is an observation
      # of the machine. If a hosted runner could not install, start, restart or
      # remove the service, this job fails by name. The one condition that is a
      # designed outcome rather than a failure is the tray task: when no
      # interactive desktop user can be resolved (the installer's documented
      # headless downgrade) the gate asserts that downgrade was reported instead
      # of asserting the task exists. It is a desktop UI affordance, not Agent
      # persistence (ADR-0014 clause 6), so that branch is not a silent skip of
      # the install/run/restart/uninstall claim.
      #
      # Hosted Windows runners supply the elevated token the gate requires; the
      # gate deliberately performs no literal physical OS reboot, so reboot
      # persistence is evidenced as SCM automatic-start configuration plus the
      # observed restart-on-failure, never as a reboot.
      - name: Install / run / restart / uninstall the Windows service distribution
        shell: pwsh
        run: ./scripts/ci/windows-service-install-smoke.ps1 -SetupExe "${{ github.workspace }}\dist\HooshiXAgent-Setup.exe"

  runtime-gate:
    name: Executable runtime gate guard
    runs-on: ubuntu-latest
    # Bounded so a hung step cannot hold a hosted runner (and the
    # release gate chained behind it) indefinitely.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Enforce fail-closed runtime gate
        shell: bash
        run: bash scripts/ci/runtime-gate.sh

  prototype-smoke:
    name: AG-9 first prototype smoke
    runs-on: ubuntu-latest
    # Bounded so a hung step cannot hold a hosted runner (and the
    # release gate chained behind it) indefinitely.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run first prototype smoke
        shell: bash
        run: bash scripts/ci/prototype-smoke.sh

  release-gate:
    name: AG-8 final security / resilience / release gate
    needs:
      - go-quality
      - agent-platform
      - architecture
      - security
      - resource-dos
      - streaming-ingress
      - http-proxy-correctness
      - supply-chain
      - metadata-scalability
      - observability-writer
      - agent-state-installer
      - agent-state-transaction
      - filesystem-installer-hardening
      - infrastructure-runtime
      - comprehensive-tests
      - performance-capacity
      - e2e-acceptance
      - live-metadata-lifecycle
      - multi-host-public-edge
      - packaging-ops
      - runtime-gate
      - windows-distribution-build
    runs-on: ubuntu-latest
    # Bounded so a hung step cannot hold a hosted runner (and the
    # release gate chained behind it) indefinitely.
    timeout-minutes: 60
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run final Agent/Gateway release gate
        shell: bash
        env:
          HOOSHIX_RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/hooshix-ag8-evidence
        run: bash scripts/ci/release-gate.sh

      - name: Upload AG-8 release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ag8-release-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/hooshix-ag8-evidence/AG8-EVIDENCE.txt
          if-no-files-found: error
          retention-days: 30
