name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-quality:
    name: Go quality / tests / vulnerability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Install pinned Go quality tools
        shell: bash
        run: |
          set -euo pipefail
          go install golang.org/x/tools/cmd/goimports@v0.48.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run Go quality baseline
        shell: bash
        run: bash scripts/ci/go-quality.sh

  agent-platform:
    name: Agent platform foundations (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Test Agent platform foundations
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./internal/agent
          go build ./cmd/agent

      - name: Fuzz Agent local-target policy
        shell: bash
        run: go test -run '^$' -fuzz '^FuzzValidateLocalTarget$' -fuzztime=1s ./internal/agent

      - name: Clean Agent package install / rollback / uninstall (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/ci/agent-install-smoke.sh

      - name: Clean Agent package install / rollback / uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/agent-install-smoke.ps1

  architecture:
    name: Architecture fitness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run architecture fitness tests
        shell: bash
        run: go test -count=1 ./internal/architecture

  security:
    name: Gitleaks / Semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Install Semgrep
        shell: bash
        run: python -m pip install --disable-pip-version-check semgrep==1.174.0

      - name: Install Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" /tmp/gitleaks
          archive="/tmp/gitleaks/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C /tmp/gitleaks gitleaks
          install -m 0755 /tmp/gitleaks/gitleaks "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run secret and static security scans
        shell: bash
        run: bash scripts/ci/security.sh

  resource-dos:
    name: R-3 resource / DoS budget gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run resource and DoS budget gate
        shell: bash
        run: bash scripts/ci/resource-dos.sh

  streaming-ingress:
    name: R-4 streaming ingress gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run streaming ingress gate
        shell: bash
        run: bash scripts/ci/streaming-ingress.sh

  http-proxy-correctness:
    name: R-5 HTTP / stream isolation gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run HTTP and stream-isolation gate
        shell: bash
        run: bash scripts/ci/http-proxy-correctness.sh

  supply-chain:
    name: R-6 release / supply-chain gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run release and supply-chain gate
        shell: bash
        run: bash scripts/ci/supply-chain.sh

  metadata-scalability:
    name: R-7 metadata scalability / determinism gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run metadata scalability and determinism gate
        shell: bash
        run: bash scripts/ci/metadata-scalability.sh

  observability-writer:
    name: R-8 observability / writer isolation gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run observability and writer-isolation gate
        shell: bash
        run: bash scripts/ci/observability-writer.sh

  agent-state-installer:
    name: R-9 Agent state / installer hardening gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run Agent state and installer hardening gate
        shell: bash
        run: bash scripts/ci/agent-state-installer.sh

  infrastructure-runtime:
    name: R-10 infrastructure runtime hardening gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run infrastructure runtime hardening gate
        shell: bash
        run: bash scripts/ci/infrastructure-runtime.sh

  comprehensive-tests:
    name: R-11 comprehensive test expansion gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run comprehensive test expansion gate
        shell: bash
        env:
          HOOSHIX_R11_COVERAGE_DIR: ${{ runner.temp }}/hooshix-r11-coverage
        run: bash scripts/ci/comprehensive-tests.sh

      - name: Upload R-11 coverage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r11-coverage-${{ github.sha }}
          path: ${{ runner.temp }}/hooshix-r11-coverage
          if-no-files-found: error
          retention-days: 30

  e2e-acceptance:
    name: Agent↔Gateway E2E acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run real Agent↔Gateway E2E acceptance
        shell: bash
        run: bash scripts/ci/e2e-acceptance.sh

  packaging-ops:
    name: Packaging / clean deployment / rollback
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run packaging and operations gate
        shell: bash
        run: bash scripts/ci/packaging-ops.sh

  runtime-gate:
    name: Executable runtime gate guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Enforce fail-closed runtime gate
        shell: bash
        run: bash scripts/ci/runtime-gate.sh

  prototype-smoke:
    name: AG-9 first prototype smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run first prototype smoke
        shell: bash
        run: bash scripts/ci/prototype-smoke.sh

  release-gate:
    name: AG-8 final security / resilience / release gate
    needs:
      - go-quality
      - agent-platform
      - architecture
      - security
      - resource-dos
      - streaming-ingress
      - http-proxy-correctness
      - supply-chain
      - metadata-scalability
      - observability-writer
      - agent-state-installer
      - infrastructure-runtime
      - comprehensive-tests
      - e2e-acceptance
      - packaging-ops
      - runtime-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Go 1.27
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run final Agent/Gateway release gate
        shell: bash
        env:
          HOOSHIX_RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/hooshix-ag8-evidence
        run: bash scripts/ci/release-gate.sh

      - name: Upload AG-8 release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ag8-release-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/hooshix-ag8-evidence/AG8-EVIDENCE.txt
          if-no-files-found: error
          retention-days: 30
