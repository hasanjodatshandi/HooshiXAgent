services:
  gateway:
    build:
      context: ../..
      dockerfile: deploy/gateway/Dockerfile
    image: ${HOOSHIX_GATEWAY_IMAGE:-hooshix-gateway:local}
    restart: unless-stopped
    command:
      - -listen
      - 0.0.0.0:8443
      # Gateway-local liveness/readiness/metrics are served on a separate
      # administrative listener. It is bound to loopback inside the container
      # (the container healthcheck below uses it) and is never published, so it
      # can never shadow a tenant route.
      - -ops-listen
      - 127.0.0.1:9090
      # The Caddy edge terminates public TLS and supplies the client address.
      # Only this trusted peer set may contribute an X-Forwarded-For hop; every
      # other client-supplied forwarding header is discarded by the Gateway.
      - -trusted-proxy
      - ${HOOSHIX_TRUSTED_PROXY:-172.16.0.0/12}
      - -tls-cert
      - /run/hooshix-tls/gateway.crt
      - -tls-key
      - /run/hooshix-tls/gateway.key
      - -metadata-dir
      - /var/lib/hooshix/metadata
      - -metadata-mode
      - ${HOOSHIX_METADATA_MODE:-live}
      - -metadata-refresh-interval
      - ${HOOSHIX_METADATA_REFRESH_INTERVAL:-1s}
      - -metadata-max-age
      - ${HOOSHIX_METADATA_MAX_AGE:-30s}
      - -max-agent-sessions
      - "64"
      - -max-pending-handshakes
      - "64"
      - -max-stream-queue-bytes
      - "2097152"
      - -max-session-queue-bytes
      - "8388608"
      - -max-global-queue-bytes
      - "33554432"
      - -max-ingress-inflight
      - "32"
      - -max-ingress-inflight-bytes
      - "33554432"
      - -handshake-rate
      - "32"
      - -handshake-burst
      - "64"
      - -ingress-rate
      - "256"
      - -ingress-burst
      - "512"
      - -preauth-rate
      - "16"
      - -preauth-burst
      - "32"
    volumes:
      - type: bind
        source: ${HOOSHIX_METADATA_DIR:-./runtime/metadata}
        target: /var/lib/hooshix/metadata
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOOSHIX_TLS_DIR:-./runtime/tls}/gateway.crt
        target: /run/hooshix-tls/gateway.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOOSHIX_TLS_DIR:-./runtime/tls}/gateway.key
        target: /run/hooshix-tls/gateway.key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOOSHIX_TLS_DIR:-./runtime/tls}/ca.crt
        target: /run/hooshix-tls/ca.crt
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "8443"
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:9090/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    user: "10001:10001"
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      HOOSHIX_PUBLIC_HOST: ${HOOSHIX_PUBLIC_HOST:-localhost}
      HOOSHIX_TLS_ASK_URL: ${HOOSHIX_TLS_ASK_URL:-}
    ports:
      - "${HOOSHIX_HTTP_PORT:-80}:80"
      - "${HOOSHIX_HTTPS_PORT:-443}:443"
    volumes:
      - type: bind
        source: ${HOOSHIX_CADDYFILE:-./Caddyfile}
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOOSHIX_TLS_DIR:-./runtime/tls}/ca.crt
        target: /etc/caddy/gateway-ca.pem
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: caddy_data
        target: /data
      - type: volume
        source: caddy_config
        target: /config
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 256
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      # Verify the public certificate instead of skipping verification. Two
      # roots can be in play: the real ACME chain (production dynamic mode),
      # already trusted through the image's ca-certificates bundle, and Caddy's
      # own internal CA root (static compatibility / localhost, and the CI
      # fixtures). Concatenating both when the internal root exists covers every
      # mode without ever falling back to an unverified handshake.
      #
      # This only asserts that the edge is up and terminating TLS for an HTTP
      # request: any status code (200/404/502/...) proves an HTTP response came
      # back, so --fail is deliberately not used. The neutral "/" probe path is
      # intentional: the edge itself refuses /readyz, and /healthz must stay a
      # tenant route, so neither is a valid edge-liveness signal. %{http_code}
      # is 000 exactly when no HTTP response arrived (TLS/connection failure),
      # which is the only condition reported unhealthy.
      test:
        - CMD-SHELL
        - >-
          cat /etc/ssl/certs/ca-certificates.crt > /tmp/hooshix-healthca.pem 2>/dev/null;
          cat /data/caddy/pki/authorities/local/root.crt >> /tmp/hooshix-healthca.pem 2>/dev/null;
          code="$$(curl --silent --show-error --cacert /tmp/hooshix-healthca.pem --resolve "$${HOOSHIX_PUBLIC_HOST}:443:127.0.0.1" --output /dev/null --write-out '%{http_code}' "https://$${HOOSHIX_PUBLIC_HOST}/")";
          case "$$code" in [1-5][0-9][0-9]) exit 0 ;; *) exit 1 ;; esac
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  edge:

volumes:
  caddy_data:
  caddy_config:
