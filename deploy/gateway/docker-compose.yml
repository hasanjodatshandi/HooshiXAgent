services:
  gateway:
    build:
      context: ../..
      dockerfile: deploy/gateway/Dockerfile
    image: ${HOOSHIX_GATEWAY_IMAGE:-hooshix-gateway:local}
    restart: unless-stopped
    command:
      - -listen
      - 0.0.0.0:8443
      - -tls-cert
      - /run/hooshix-tls/gateway.crt
      - -tls-key
      - /run/hooshix-tls/gateway.key
      - -metadata-dir
      - /var/lib/hooshix/metadata
      - -metadata-mode
      - ${HOOSHIX_METADATA_MODE:-live}
      - -metadata-refresh-interval
      - ${HOOSHIX_METADATA_REFRESH_INTERVAL:-1s}
      - -metadata-max-age
      - ${HOOSHIX_METADATA_MAX_AGE:-30s}
      - -max-agent-sessions
      - "64"
      - -max-pending-handshakes
      - "64"
      - -max-stream-queue-bytes
      - "2097152"
      - -max-session-queue-bytes
      - "8388608"
      - -max-global-queue-bytes
      - "33554432"
      - -max-ingress-inflight
      - "32"
      - -max-ingress-inflight-bytes
      - "33554432"
      - -handshake-rate
      - "32"
      - -handshake-burst
      - "64"
      - -ingress-rate
      - "256"
      - -ingress-burst
      - "512"
    volumes:
      - type: bind
        source: ${HOOSHIX_METADATA_DIR:-./runtime/metadata}
        target: /var/lib/hooshix/metadata
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOOSHIX_TLS_DIR:-./runtime/tls}/gateway.crt
        target: /run/hooshix-tls/gateway.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOOSHIX_TLS_DIR:-./runtime/tls}/gateway.key
        target: /run/hooshix-tls/gateway.key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOOSHIX_TLS_DIR:-./runtime/tls}/ca.crt
        target: /run/hooshix-tls/ca.crt
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "8443"
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--cacert", "/run/hooshix-tls/ca.crt", "https://gateway:8443/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    user: "10001:10001"
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      HOOSHIX_PUBLIC_HOST: ${HOOSHIX_PUBLIC_HOST:-localhost}
      HOOSHIX_TLS_ASK_URL: ${HOOSHIX_TLS_ASK_URL:-}
    ports:
      - "${HOOSHIX_HTTP_PORT:-80}:80"
      - "${HOOSHIX_HTTPS_PORT:-443}:443"
    volumes:
      - type: bind
        source: ${HOOSHIX_CADDYFILE:-./Caddyfile}
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOOSHIX_TLS_DIR:-./runtime/tls}/ca.crt
        target: /etc/caddy/gateway-ca.pem
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: caddy_data
        target: /data
      - type: volume
        source: caddy_config
        target: /config
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 256
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error --insecure --resolve "$${HOOSHIX_PUBLIC_HOST}:443:127.0.0.1" "https://$${HOOSHIX_PUBLIC_HOST}/healthz" >/dev/null
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  edge:

volumes:
  caddy_data:
  caddy_config:
