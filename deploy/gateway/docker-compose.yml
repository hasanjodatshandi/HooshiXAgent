services:
  gateway:
    build:
      context: ../..
      dockerfile: deploy/gateway/Dockerfile
    image: ${HOOSHIX_GATEWAY_IMAGE:-hooshix-gateway:local}
    restart: unless-stopped
    command:
      - -listen
      - 0.0.0.0:8443
      - -tls-cert
      - /run/hooshix-tls/gateway.crt
      - -tls-key
      - /run/hooshix-tls/gateway.key
      - -metadata-dir
      - /var/lib/hooshix/metadata
      - -max-agent-sessions
      - "64"
      - -max-pending-handshakes
      - "64"
      - -max-stream-queue-bytes
      - "2097152"
      - -max-session-queue-bytes
      - "8388608"
      - -max-global-queue-bytes
      - "33554432"
      - -max-ingress-inflight
      - "32"
      - -max-ingress-inflight-bytes
      - "33554432"
      - -handshake-rate
      - "32"
      - -handshake-burst
      - "64"
      - -ingress-rate
      - "256"
      - -ingress-burst
      - "512"
    volumes:
      - ${HOOSHIX_METADATA_DIR:-./runtime/metadata}:/var/lib/hooshix/metadata:ro
      - ${HOOSHIX_TLS_DIR:-./runtime/tls}/gateway.crt:/run/hooshix-tls/gateway.crt:ro
      - ${HOOSHIX_TLS_DIR:-./runtime/tls}/gateway.key:/run/hooshix-tls/gateway.key:ro
      - ${HOOSHIX_TLS_DIR:-./runtime/tls}/ca.crt:/run/hooshix-tls/ca.crt:ro
    expose:
      - "8443"
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--cacert", "/run/hooshix-tls/ca.crt", "https://gateway:8443/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      HOOSHIX_PUBLIC_HOST: ${HOOSHIX_PUBLIC_HOST:-localhost}
    ports:
      - "${HOOSHIX_HTTP_PORT:-80}:80"
      - "${HOOSHIX_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${HOOSHIX_TLS_DIR:-./runtime/tls}/ca.crt:/etc/caddy/gateway-ca.pem:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  edge:

volumes:
  caddy_data:
  caddy_config:
