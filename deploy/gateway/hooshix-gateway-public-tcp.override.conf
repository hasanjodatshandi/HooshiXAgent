[Service]
ExecStart=
ExecStart=/opt/hooshix/hooshix-gateway \
    -listen 127.0.0.1:8443 \
    -ops-listen 127.0.0.1:9090 \
    -trusted-proxy 127.0.0.1 \
    -tls-cert /var/lib/hooshix/tls/gateway.crt \
    -tls-key /var/lib/hooshix/tls/gateway.key \
    -metadata-dir /var/lib/hooshix/metadata \
    -metadata-mode live \
    -metadata-refresh-interval 1s \
    -metadata-max-age 30s \
    -max-ingress-inflight 200 \
    -public-tcp-bind 0.0.0.0 \
    -public-tcp-port-min 20000 \
    -public-tcp-port-max 29999 \
    -public-tcp-refresh-interval 1s \
    -log-level info
